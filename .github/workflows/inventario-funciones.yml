# Temporal y de solo lectura: inventario de funciones publicadas de Mi Comunidad
# (estado, grupo de despliegue y NOMBRES/versiones de secretos, nunca valores).
name: Inventario funciones
on:
  push:
    branches: [claude/serene-archimedes-srx727]
    paths: [".github/workflows/inventario-funciones.yml"]
permissions:
  contents: read
jobs:
  inventario:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Listar funciones
        run: |
          TOKEN=$(python3 - <<'PY'
          import json,urllib.request,urllib.parse,os,time,base64
          import subprocess
          PY
          )
          gcloud auth print-access-token > /tmp/t 2>/dev/null || true
          T=$(cat /tmp/t)
          curl -sS -H "Authorization: Bearer $T" "https://cloudfunctions.googleapis.com/v2/projects/mercado-ciudadano/locations/-/functions?pageSize=200" > f.json
          python3 - <<'PY'
          import json
          d=json.load(open('f.json'))
          if 'error' in d: print('ERROR', d['error'].get('status'), d['error'].get('message')); raise SystemExit(1)
          for f in sorted(d.get('functions',[]), key=lambda f:f['name']):
              n=f['name'].rsplit('/',1)[-1]
              if 'MiComunidad' not in n and 'Nodar' not in n and 'MercadoPago' not in n: continue
              l=f.get('labels',{}); sc=f.get('serviceConfig',{})
              sec=[f"{s['key']}->{s['secret']}@{s['version']}" for s in sc.get('secretEnvironmentVariables',[])]
              print(n, f.get('state'), 'codebase='+l.get('firebase-functions-codebase','default'), f.get('updateTime','')[:19], ' '.join(sec))
          PY
