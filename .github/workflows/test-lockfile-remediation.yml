name: Regenerate test dependency lockfile
on:
  pull_request:
    paths:
      - 'tests/package.json'
      - 'tests/package-lock.json'
      - '.github/workflows/test-lockfile-remediation.yml'
permissions:
  contents: read
jobs:
  regenerate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Regenerate lockfile with npm resolver
        working-directory: tests
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Require the committed lockfile to match the resolver
        run: git diff --exit-code -- tests/package-lock.json
      - name: Audit resolved dependencies
        working-directory: tests
        run: npm audit --audit-level=moderate
      - name: Confirm clean installation
        working-directory: tests
        run: npm ci --ignore-scripts
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-tests-package-lock
          path: tests/package-lock.json
          if-no-files-found: error
