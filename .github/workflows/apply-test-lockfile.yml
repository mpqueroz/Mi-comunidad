name: Apply verified test lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-lockfile:
    if: github.ref == 'refs/heads/security/auditoria-blindaje-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and verify test dependencies
        working-directory: tests
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
      - name: Commit only regenerated test lockfile
        run: |
          git add -- tests/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(test-deps): sync audited dependency lockfile'
          git push origin HEAD:security/auditoria-blindaje-2026-11
