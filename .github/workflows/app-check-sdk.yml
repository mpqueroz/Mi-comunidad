name: Verify App Check SDK
on:
  pull_request:
    paths:
      - '.github/workflows/app-check-sdk.yml'
      - 'scripts/verificar-sdk-app-check.cjs'
      - 'public/vendor/firebase-10.13.2/firebase-app-check-compat.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verificar copia local contra SDK oficial fijado
        run: node scripts/verificar-sdk-app-check.cjs --verify
