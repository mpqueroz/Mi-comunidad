name: App Check preview aislado
on:
  pull_request:
    paths:
      - "qa/**"
      - "scripts/preparar-preview-appcheck.cjs"
      - "public/app-check.js"
      - ".github/workflows/appcheck-preview.yml"
permissions:
  contents: read
concurrency:
  group: appcheck-preview-auditoria
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'mpqueroz/Mi-comunidad' &&
      github.event.pull_request.number == 18 &&
      github.event.pull_request.head.repo.full_name == 'mpqueroz/Mi-comunidad' &&
      github.event.pull_request.head.ref == 'security/auditoria-blindaje-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Validar aislamiento sin credenciales
        run: node --test qa/appcheck-preview.test.cjs
      - name: Instalar herramientas fijadas antes de autenticar
        working-directory: tests
        run: npm ci --ignore-scripts
      - name: Preparar exclusivamente los archivos del diagnóstico
        run: node scripts/preparar-preview-appcheck.cjs
      - name: Confirmar que la CLI permite omitir cambios de dominios Auth
        run: node scripts/firebase-cli.cjs hosting:channel:deploy --help | grep -- --no-authorized-domains
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publicar únicamente canal temporal de diagnóstico
        run: >-
          node scripts/firebase-cli.cjs hosting:channel:deploy auditoria-appcheck
          --project mercado-ciudadano --config .appcheck-preview/firebase.json
          --only mi-comunidad-md --expires 1d --no-authorized-domains --non-interactive
