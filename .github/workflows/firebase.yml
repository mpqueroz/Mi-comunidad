# Prueba las reglas de Firestore en cada pull request y, al aceptar cambios
# en main, despliega la página (hosting del sitio mi-comunidad-md), las
# reglas y las Cloud Functions de Mi Comunidad a Firebase.
#
# Requiere el secret FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and
# variables → Actions) con el JSON de una cuenta de servicio. Ver LEEME.md.

name: Firebase

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "functions/**"
      - "tests/**"
      - "public/**"
      - "firebase.json"
      - "firebase.test.json"
      - "scripts/**"
      - ".github/workflows/firebase.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "functions/**"
      - "public/**"
      - "firebase.json"
      - "firebase.test.json"
      - "scripts/**"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

# Mínimo privilegio para el token de GitHub: solo leer el repositorio.
permissions:
  contents: read

# Nunca dos deploys a la vez.
concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests de reglas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        working-directory: tests
        run: npm ci
      - name: Revisar que las functions cargan
        working-directory: functions
        run: |
          npm ci
          node -e 'require("./index.js")'
          npm test
          npm audit --omit=dev --audit-level=moderate
      - name: Correr tests en el emulador
        working-directory: tests
        run: npm test
      - name: Auditar herramientas sin excepciones de severidad
        working-directory: tests
        run: npm audit --audit-level=moderate

  deploy:
    name: Deploy a Firebase
    needs: tests
    # Solo al aceptar cambios en main (o a mano desde la pestaña Actions).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar herramientas verificadas
        working-directory: tests
        run: |
          npm ci
          npm audit --audit-level=moderate
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Muestra solo el correo de la cuenta de servicio (no la llave), para
      # saber con qué cuenta se autentica el deploy si falla un permiso.
      - name: Cuenta de servicio en uso
        run: 'echo "Deploy como: $(jq -r .client_email "$GOOGLE_APPLICATION_CREDENTIALS")"'
      - name: Instalar dependencias de functions
        working-directory: functions
        run: npm ci
      - name: Conservar reglas vigentes de las otras aplicaciones
        run: node scripts/preparar-reglas-compartidas.cjs
      - name: Probar reglas combinadas antes de publicar
        working-directory: tests
        run: npm test
      # Las funciones de cobro (crearCheckout, webhookMercadoPago, consultarLicencia,
      # conciliarPagos) NO se despliegan desde aquí: están conectadas a mano a los
      # secretos de producción y un despliegue normal las volvería a enlazar a los
      # de prueba. Se publican solo con scripts/habilitar-produccion.sh.
      # El proyecto es compartido con Mercado Ciudadano y Almacén Digital:
      # se nombran las functions de Mi Comunidad una por una para que el
      # deploy nunca borre ni toque las de las otras apps, y el hosting va
      # solo al sitio mi-comunidad-md (firebase.json). Las functions que no
      # cambiaron se saltan solas.
      - name: Desplegar funciones de Mi Comunidad
        run: >
          ./tests/node_modules/.bin/firebase deploy --non-interactive
          --only "functions:generarCobrosMiComunidad,functions:crearCuentaMiComunidad,functions:restablecerClaveMiComunidad,functions:crearComunidadMiComunidad,functions:crearReservaMiComunidad,functions:directorioConserjeriaMiComunidad,functions:cambiarEstadoAdminMiComunidad,functions:crearAdministradorMiComunidad,functions:definirPreguntaSecretaMiComunidad,functions:verificarPreguntaSecretaMiComunidad,functions:migrarRespuestasSecretasMiComunidad,functions:actualizarVencimientosMiComunidad,functions:depurarRegistrosMiComunidad,functions:resumenComercialMiComunidad,functions:historialPagosMiComunidad,functions:rehabilitarLicenciaMiComunidad,functions:configurarPagosMiComunidad,functions:guardarPlanMantencionMiComunidad,functions:registrarRevisionMantencionMiComunidad,functions:gestionarAvisoMiComunidad,functions:confirmarAvisoMiComunidad,functions:gestionarVisitaMiComunidad,functions:cancelarReservaMiComunidad,functions:registrarEncomiendaMiComunidad,functions:gestionarTurnoMiComunidad,functions:gestionarEncomiendaMiComunidad,functions:verificarFichaMiComunidad"
      - name: Publicar reglas compartidas
        run: ./tests/node_modules/.bin/firebase deploy --non-interactive --only firestore:rules
      - name: Verificar reglas publicadas
        run: node scripts/preparar-reglas-compartidas.cjs --verify
      - name: Publicar página
        run: ./tests/node_modules/.bin/firebase deploy --non-interactive --only hosting
      - name: Comprobar servicio y rechazos sin sesión
        run: node scripts/comprobar-despliegue.cjs --release
      # Solo lectura: cuántos registros vencidos borraría la depuración programada.
      # Si la cuenta de servicio no puede leer Firestore, el aviso queda en el
      # registro sin marcar como fallido un despliegue que ya terminó.
      - name: Simular depuración de registros
        continue-on-error: true
        run: node scripts/simular-depuracion.cjs

  public-smoke:
    name: Comprobación pública sin credenciales
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Comprobar servicio publicado y solicitudes sin sesión
        run: node scripts/comprobar-despliegue.cjs
