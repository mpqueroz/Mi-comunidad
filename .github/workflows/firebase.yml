# Prueba las reglas de Firestore en cada pull request y, al aceptar cambios
# en main, despliega reglas y Cloud Functions de Mi Comunidad a Firebase.
#
# Requiere el secret FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and
# variables → Actions) con el JSON de una cuenta de servicio. Ver LEEME.md.

name: Firebase

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "functions/**"
      - "tests/**"
      - "firebase.json"
      - ".github/workflows/firebase.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

# Nunca dos deploys a la vez.
concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests de reglas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        working-directory: tests
        run: npm ci
      - name: Correr tests en el emulador
        working-directory: tests
        run: npm test
      - name: Revisar que las functions cargan
        working-directory: functions
        run: |
          npm ci
          node -e 'require("./index.js")'

  deploy:
    name: Deploy a Firebase
    needs: tests
    # Solo al aceptar cambios en main (o a mano desde la pestaña Actions).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Instalar dependencias de functions
        working-directory: functions
        run: npm ci
      # El proyecto es compartido con Mercado Ciudadano y Almacén Digital:
      # se nombran las functions de Mi Comunidad una por una para que el
      # deploy nunca borre ni toque las de las otras apps.
      - name: Deploy de reglas y functions
        run: >
          npx --yes firebase-tools@14 deploy --non-interactive
          --only "firestore:rules,functions:crearCuentaMiComunidad,functions:restablecerClaveMiComunidad,functions:crearComunidadMiComunidad,functions:crearReservaMiComunidad,functions:definirPreguntaSecretaMiComunidad,functions:verificarPreguntaSecretaMiComunidad,functions:migrarRespuestasSecretasMiComunidad,functions:actualizarVencimientosMiComunidad"
